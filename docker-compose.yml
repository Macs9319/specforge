x-app-env: &app-env
  DATABASE_URL: postgresql://specforge:specforge@postgres:5432/specforge
  NODE_ENV: development
  LOG_LEVEL: info
  AUTH_SECRET: dev-only-docker-compose-secret-do-not-use-in-prod
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: specforge-documents
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_FORCE_PATH_STYLE: "true"
  REDIS_URL: redis://redis:6379
  # No real Anthropic/OpenAI key baked into version-controlled compose
  # config — defaults to the fake provider. Override LLM_PROVIDER and
  # ANTHROPIC_API_KEY or OPENAI_API_KEY in your shell environment (they take
  # precedence over this file) to use a real adapter.
  LLM_PROVIDER: "${LLM_PROVIDER:-fake}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-5}"
  LLM_EFFORT: "${LLM_EFFORT:-high}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4}"
  GENERATION_DAILY_LIMIT: "10"

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge
      POSTGRES_DB: specforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment: *app-env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # migrate deploy (not `migrate dev`) is the non-interactive,
    # apply-pending-migrations-only command — safe to run on every
    # container start, including against a brand-new empty database.
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment: *app-env
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      # Waits on web's health (not just its container starting), since
      # web is what runs `prisma migrate deploy` — this guarantees the
      # schema exists before the worker's first query.
      web:
        condition: service_healthy
    command: sh -c "npx prisma generate && npm run worker:dev"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
